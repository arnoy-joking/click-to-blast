<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click to Blast</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      cursor: crosshair;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hint {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 0.6s;
      z-index: 10;
    }
    #hint.hide { opacity: 0; }
  </style>
</head>
<body>
  <div id="hint">click anywhere to blast</div>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');
    let W, H;
    let particles = [];
    let sparks = [];
    let shake = 0;
    let firstClick = true;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Color palette - hot blast vibes
    const colors = [
      '#ff3b3b', '#ff6b35', '#ff9f1c', '#ffd60a',
      '#ff006e', '#8338ec', '#3a86ff', '#00f5d4',
      '#ffffff', '#ff4d6d'
    ];

    class Particle {
      constructor(x, y, type = 'blast') {
        this.x = x;
        this.y = y;
        this.type = type;
        const angle = Math.random() * Math.PI * 2;
        const speed = type === 'spark'
          ? 2 + Math.random() * 8
          : 4 + Math.random() * 14;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1;
        this.decay = type === 'spark'
          ? 0.015 + Math.random() * 0.025
          : 0.008 + Math.random() * 0.015;
        this.size = type === 'spark'
          ? 1 + Math.random() * 2.5
          : 2 + Math.random() * 5;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.gravity = type === 'spark' ? 0.05 : 0.12;
        this.friction = 0.98;
      }

      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        this.size *= 0.99;
      }

      draw() {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();

        // glow
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    function blast(x, y) {
      // main particles
      const count = 40 + Math.floor(Math.random() * 30);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, 'blast'));
      }
      // sparks
      for (let i = 0; i < 20; i++) {
        sparks.push(new Particle(x, y, 'spark'));
      }
      // shockwave ring
      particles.push({
        x, y,
        type: 'ring',
        radius: 0,
        maxRadius: 80 + Math.random() * 60,
        life: 1,
        decay: 0.03,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
      shake = 8 + Math.random() * 6;
    }

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      blast(x, y);

      if (firstClick) {
        hint.classList.add('hide');
        firstClick = false;
      }
    });

    // also support continuous hold for rapid fire
    let holding = false;
    canvas.addEventListener('pointerdown', () => holding = true);
    canvas.addEventListener('pointerup', () => holding = false);
    canvas.addEventListener('pointerleave', () => holding = false);

    let lastBurst = 0;
    function autoBurst(e) {
      if (!holding) return;
      const now = performance.now();
      if (now - lastBurst < 80) return;
      lastBurst = now;
      const rect = canvas.getBoundingClientRect();
      blast(e.clientX - rect.left, e.clientY - rect.top);
    }
    canvas.addEventListener('pointermove', autoBurst);

    function loop() {
      // clear with slight trail for motion blur feel
      ctx.fillStyle = 'rgba(10, 10, 15, 0.25)';
      ctx.fillRect(0, 0, W, H);

      // screen shake
      ctx.save();
      if (shake > 0) {
        ctx.translate(
          (Math.random() - 0.5) * shake,
          (Math.random() - 0.5) * shake
        );
        shake *= 0.9;
        if (shake < 0.3) shake = 0;
      }

      // update & draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.type === 'ring') {
          p.radius += (p.maxRadius - p.radius) * 0.12;
          p.life -= p.decay;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.life * 0.6);
          ctx.lineWidth = 2 + (1 - p.life) * 4;
          ctx.stroke();
          ctx.globalAlpha = 1;
          if (p.life <= 0) particles.splice(i, 1);
        } else {
          p.update();
          p.draw();
          if (p.life <= 0 || p.size < 0.2) particles.splice(i, 1);
        }
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.update();
        s.draw();
        if (s.life <= 0) sparks.splice(i, 1);
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
