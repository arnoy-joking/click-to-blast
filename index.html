<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click to Blast — Bomb Mode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050508;
      cursor: crosshair;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hint {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 180, 80, 0.55);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 0.5s;
      z-index: 10;
      text-shadow: 0 0 12px rgba(255,100,0,0.4);
    }
    #hint.hide { opacity: 0; }
  </style>
</head>
<body>
  <div id="hint">click to drop a bomb</div>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');
    let W, H;
    let particles = [];
    let smoke = [];
    let debris = [];
    let rings = [];
    let flashes = [];
    let shake = 0;
    let firstClick = true;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Fire / explosion palette
    const fireColors = ['#fff7e0', '#ffea80', '#ffb347', '#ff6b1a', '#ff3b00', '#e62e00', '#a01000'];
    const smokeColors = ['#4a4038', '#3a322c', '#2c2622', '#1f1a18', '#151210'];
    const debrisColors = ['#8b7355', '#6b5344', '#5a4638', '#3d2e24', '#2a1f18', '#ff4500'];

    class Particle {
      constructor(x, y, opts = {}) {
        this.x = x;
        this.y = y;
        this.vx = opts.vx || 0;
        this.vy = opts.vy || 0;
        this.life = opts.life ?? 1;
        this.decay = opts.decay ?? 0.012;
        this.size = opts.size ?? 3;
        this.color = opts.color || fireColors[0];
        this.gravity = opts.gravity ?? 0.08;
        this.friction = opts.friction ?? 0.97;
        this.type = opts.type || 'fire';
        this.spin = opts.spin || 0;
        this.angle = Math.random() * Math.PI * 2;
      }

      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        this.angle += this.spin;
        if (this.type === 'fire') this.size *= 0.985;
        if (this.type === 'smoke') this.size *= 1.01;
      }

      draw() {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        if (this.type === 'debris') {
          ctx.fillStyle = this.color;
          ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.7);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(0.2, this.size), 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
          if (this.type === 'fire') {
            ctx.shadowBlur = 18;
            ctx.shadowColor = this.color;
            ctx.fill();
          }
        }
        ctx.restore();
      }
    }

    function bomb(x, y) {
      // 1. Big flash
      flashes.push({
        x, y,
        radius: 0,
        max: 70 + Math.random() * 40,
        life: 1,
        decay: 0.07
      });

      // 2. Core fireball particles (dense, outward)
      const coreCount = 55 + Math.floor(Math.random() * 25);
      for (let i = 0; i < coreCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 12;
        particles.push(new Particle(x, y, {
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          size: 4 + Math.random() * 8,
          life: 0.9 + Math.random() * 0.4,
          decay: 0.012 + Math.random() * 0.01,
          color: fireColors[Math.floor(Math.random() * fireColors.length)],
          gravity: 0.06 + Math.random() * 0.06,
          type: 'fire'
        }));
      }

      // 3. Secondary sparks / embers
      for (let i = 0; i < 35; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 6 + Math.random() * 16;
        particles.push(new Particle(x, y, {
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4,
          size: 1.5 + Math.random() * 3,
          life: 0.7 + Math.random() * 0.5,
          decay: 0.01 + Math.random() * 0.012,
          color: fireColors[Math.floor(Math.random() * 4)],
          gravity: 0.15,
          type: 'fire'
        }));
      }

      // 4. Smoke plume
      for (let i = 0; i < 28; i++) {
        const angle = (Math.random() - 0.5) * 1.4 - Math.PI / 2; // mostly upward
        const speed = 1.5 + Math.random() * 4;
        smoke.push(new Particle(x + (Math.random() - 0.5) * 20, y, {
          vx: Math.cos(angle) * speed * 0.6,
          vy: Math.sin(angle) * speed - 1.5,
          size: 8 + Math.random() * 18,
          life: 1.2 + Math.random() * 0.8,
          decay: 0.006 + Math.random() * 0.005,
          color: smokeColors[Math.floor(Math.random() * smokeColors.length)],
          gravity: -0.02,
          friction: 0.99,
          type: 'smoke'
        }));
      }

      // 5. Debris / shrapnel
      for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 14;
        debris.push(new Particle(x, y, {
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          size: 2 + Math.random() * 5,
          life: 1.1 + Math.random() * 0.6,
          decay: 0.008 + Math.random() * 0.006,
          color: debrisColors[Math.floor(Math.random() * debrisColors.length)],
          gravity: 0.25,
          friction: 0.96,
          spin: (Math.random() - 0.5) * 0.4,
          type: 'debris'
        }));
      }

      // 6. Shockwave rings
      rings.push({
        x, y,
        radius: 5,
        max: 120 + Math.random() * 80,
        life: 1,
        decay: 0.025,
        width: 4
      });
      rings.push({
        x, y,
        radius: 2,
        max: 70 + Math.random() * 40,
        life: 1,
        decay: 0.04,
        width: 2.5
      });

      // Screen shake — stronger for bombs
      shake = 14 + Math.random() * 10;
    }

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      bomb(x, y);

      if (firstClick) {
        hint.classList.add('hide');
        firstClick = false;
      }
    });

    // Hold for rapid bombing
    let holding = false;
    let lastBomb = 0;
    canvas.addEventListener('pointerdown', () => holding = true);
    canvas.addEventListener('pointerup', () => holding = false);
    canvas.addEventListener('pointerleave', () => holding = false);

    canvas.addEventListener('pointermove', (e) => {
      if (!holding) return;
      const now = performance.now();
      if (now - lastBomb < 110) return;
      lastBomb = now;
      const rect = canvas.getBoundingClientRect();
      bomb(e.clientX - rect.left, e.clientY - rect.top);
    });

    function loop() {
      // Dark trail for lingering smoke/fire feel
      ctx.fillStyle = 'rgba(5, 5, 8, 0.22)';
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      if (shake > 0) {
        ctx.translate(
          (Math.random() - 0.5) * shake,
          (Math.random() - 0.5) * shake
        );
        shake *= 0.88;
        if (shake < 0.4) shake = 0;
      }

      // Flashes (bright expanding core)
      for (let i = flashes.length - 1; i >= 0; i--) {
        const f = flashes[i];
        f.radius += (f.max - f.radius) * 0.25;
        f.life -= f.decay;
        const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
        g.addColorStop(0, `rgba(255, 250, 220, ${f.life * 0.9})`);
        g.addColorStop(0.3, `rgba(255, 180, 60, ${f.life * 0.5})`);
        g.addColorStop(0.7, `rgba(255, 60, 0, ${f.life * 0.2})`);
        g.addColorStop(1, 'rgba(255, 30, 0, 0)');
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
        if (f.life <= 0) flashes.splice(i, 1);
      }

      // Shockwave rings
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        r.radius += (r.max - r.radius) * 0.09;
        r.life -= r.decay;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 160, 40, ${r.life * 0.55})`;
        ctx.lineWidth = r.width * r.life;
        ctx.stroke();
        if (r.life <= 0) rings.splice(i, 1);
      }

      // Smoke (behind fire)
      for (let i = smoke.length - 1; i >= 0; i--) {
        smoke[i].update();
        smoke[i].draw();
        if (smoke[i].life <= 0) smoke.splice(i, 1);
      }

      // Debris
      for (let i = debris.length - 1; i >= 0; i--) {
        debris[i].update();
        debris[i].draw();
        if (debris[i].life <= 0) debris.splice(i, 1);
      }

      // Fire particles on top
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0 || particles[i].size < 0.3) particles.splice(i, 1);
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
